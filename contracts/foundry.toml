[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "prague"
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
local = "http://127.0.0.1:8545"
monad_testnet = "https://testnet-rpc.monad.xyz"

[lint]
lint_on_build = false
